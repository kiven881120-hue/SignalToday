name: signaltoday

x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-project.settings.dev}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
  DATABASE_URL: postgresql://${POSTGRES_USER:-signaltoday}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-signaltoday}
  TIME_ZONE: ${TIME_ZONE:-Asia/Shanghai}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_DAILY_BUDGET_CNY: ${LLM_DAILY_BUDGET_CNY:-20}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2000}
  HTTP_PROXY: ${SIGNALTODAY_HTTP_PROXY:-}
  HTTPS_PROXY: ${SIGNALTODAY_HTTP_PROXY:-}
  NO_PROXY: ${SIGNALTODAY_NO_PROXY:-localhost,127.0.0.1,postgres,web}
  http_proxy: ${SIGNALTODAY_HTTP_PROXY:-}
  https_proxy: ${SIGNALTODAY_HTTP_PROXY:-}
  no_proxy: ${SIGNALTODAY_NO_PROXY:-localhost,127.0.0.1,postgres,web}
  SCHEDULER_PIPELINE_ENABLED: ${SCHEDULER_PIPELINE_ENABLED:-false}
  SCHEDULER_STALE_JOB_MINUTES: ${SCHEDULER_STALE_JOB_MINUTES:-30}

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - backend
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *app-service
    command: ["gunicorn", "project.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--access-logfile", "-", "--error-logfile", "-", "--no-control-socket"]
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    <<: *app-service
    command: ["python", "manage.py", "run_scheduler", "--interval", "60"]
    networks:
      - backend
      - egress

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signaltoday}
      POSTGRES_USER: ${POSTGRES_USER:-signaltoday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    name: signaltoday_postgres_data

networks:
  backend:
    name: signaltoday_backend
    internal: true
  frontend:
    name: signaltoday_frontend
  egress:
    name: signaltoday_egress
