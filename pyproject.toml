[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltoday"
version = "0.1.0"
description = "SignalToday V1 information radar"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "APScheduler==3.11.3",
  "defusedxml==0.7.1",
  "Django==5.2.17",
  "gunicorn==26.2.0",
  "psycopg[binary]==3.3.2",
  "urllib3==2.6.3",
  "whitenoise==6.12.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "project*"]

[tool.ruff]
target-version = "py312"
line-length = 100
